<div class="pc-root">
  <div class="pc-label" *ngIf="title || hint">
    <div class="pc-title" *ngIf="title">{{ title }}</div>
    <div class="pc-hint" *ngIf="hint">{{ hint }}</div>
  </div>

  <div class="pc-preview" *ngIf="previewUrl">
    <img [src]="previewUrl" alt="Foto" />
  </div>

  <div class="pc-empty" *ngIf="!previewUrl" (click)="captureFromCamera()" [class.disabled]="disabled || uploading">
    <ion-icon name="camera-outline"></ion-icon>
    <div class="pc-empty-title">Tocar para capturar</div>
    <div class="pc-empty-sub">Câmera</div>
  </div>

  <div class="pc-actions">
    <ion-button expand="block" (click)="captureFromCamera()" [disabled]="disabled || uploading">
      Capturar foto
    </ion-button>

    <ion-button expand="block" fill="outline" (click)="pickFromGallery()" [disabled]="disabled || uploading">
      Escolher da galeria
    </ion-button>

    <ion-button
      *ngIf="hasValue"
      expand="block"
      color="danger"
      fill="clear"
      (click)="remove()"
      [disabled]="disabled || uploading"
    >
      Remover
    </ion-button>
  </div>

  <!-- Web file input fallback -->
  <input
    [id]="fileInputId"
    class="pc-file-input"
    type="file"
    accept="image/*"
    (change)="onFilePicked($event)"
  />

  <div class="pc-uploading" *ngIf="uploading">
    <ion-spinner name="crescent"></ion-spinner>
    <span>Enviando...</span>
  </div>

  <ion-text color="danger" *ngIf="errMsg">
    <p class="pc-error">{{ errMsg }}</p>
  </ion-text>
</div>
