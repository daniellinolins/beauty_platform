<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/forms"></ion-back-button>
    </ion-buttons>
    <ion-title>Preencher</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-text color="danger" *ngIf="errorMsg">
    <p>{{ errorMsg }}</p>
  </ion-text>

  <ion-spinner *ngIf="loading"></ion-spinner>

  <div *ngIf="!loading && elements.length > 0">
    <app-form-renderer
      [mode]="'edit'"
      [tenantId]="tenantId"
      [defaultLang]="defaultLang"
      [elements]="elements"
      [payload]="payload"
      (error)="onRendererError($event)"
    ></app-form-renderer>

    <ion-button expand="block" style="margin-top: 18px;" (click)="save()">
      Guardar
    </ion-button>
  </div>
</ion-content>
