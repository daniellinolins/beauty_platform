<ion-header>
  <ion-toolbar>
    <ion-title>{{ formName || 'Formulário' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/forms">Voltar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>

  <div *ngIf="!loading">
    <app-form-renderer
      [mode]="'fill'"
      [tenantId]="tenantId"
      [defaultLang]="defaultLang"
      [elements]="elements"
      [payload]="payload"
      (payloadChange)="payload = $event"
      (error)="onRendererError($event)"
    ></app-form-renderer>

    <!-- Se sua main já tem botões próprios, pode remover este bloco -->
    <ion-button expand="block" style="margin-top: 16px;" (click)="save()">
      Salvar
    </ion-button>
  </div>
</ion-content>
