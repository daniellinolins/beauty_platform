<ion-header>
  <ion-toolbar>
    <ion-title>Selecionar clínica</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>

  <ion-list *ngIf="!loading">
    <ion-item
      button
      *ngFor="let c of clinics"
      (click)="chooseClinic(c)"
    >
      <ion-label>
        <h2>{{ c.clinic_name || c.name || ('Clínica #' + c.clinic_id) }}</h2>
        <p>clinic_id: {{ c.clinic_id }} • tenant_id: {{ c.tenant_id }}</p>
      </ion-label>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
